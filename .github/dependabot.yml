# ─────────────────────────────────────────────────────────────────────────────
# Dependency updates.
#
# The C++ dependencies are pinned by vcpkg.json, the Python ones by
# poetry.lock. Both are updated by this bot and reviewed like any other
# change: a dependency bump is a change to the product.
# ─────────────────────────────────────────────────────────────────────────────
version: 2

updates:
  - package-ecosystem: pip
    directory: "/libs/py-core"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "chore(deps): "

  - package-ecosystem: pip
    directory: "/services/analytics-py"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "chore(deps): "

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci): "

  - package-ecosystem: vcpkg
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies", "cpp"]
    commit-message:
      prefix: "chore(deps): "
