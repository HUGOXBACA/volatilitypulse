# ─────────────────────────────────────────────────────────────────────────────
# Prometheus scrape configuration.
#
# The ingestion engine and the analytics engine both export metrics. The
# engine metrics are pushed through the Pushgateway because the ingestion
# engine is a batch-like process with a stable identity, while the analytics
# engine is a long-running consumer that can be scraped directly.
# ─────────────────────────────────────────────────────────────────────────────
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    pipeline: volpulse
    environment: local

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: analytics
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          service: volpulse-analytics

  - job_name: influxdb
    metrics_path: /metrics
    static_configs:
      - targets: ["influxdb:8086"]

  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["host.docker.internal:9091"]
