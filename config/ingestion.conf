# ─────────────────────────────────────────────────────────────────────────────
# Machine readable configuration for the C++ ingestion engine.
#
# The C++ service deliberately uses a dependency free `key = value` parser
# (see services/ingestion-cpp/include/volpulse/ingestion/config.h). The
# canonical, human readable description of these values lives in
# config/ingestion.yaml.
#
#   volpulse-ingestion --config config/ingestion.conf
# ─────────────────────────────────────────────────────────────────────────────

# Underlying symbols to poll. Empty means "no live work configured".
symbols = AAPL,MSFT,SPY,QQQ

# Binary audit log. The parent directory is created if needed.
binary_log = var/binary-logs/options.vlog

# Quotes pulled from the source per poll.
max_batch = 512

# Seconds to wait when the source has no data.
poll_interval = 1.0

# When true nothing is written to the audit log.
dry_run = false
