[project]
name = "volpulse-core"
version = "0.1.0"
description = "Shared domain models, provider clients and observability primitives for VolPulse"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "Proprietary" }
authors = [
    { name = "One_Byte_At_A_Time", email = "codeberg.reorder429@passfwd.com" }
]
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "pandera>=0.20",
    "polars>=1.9",
    "prometheus-client>=0.21",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "numpy>=2.1",
    "scipy>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "volpulse_core", from = "src" }]
