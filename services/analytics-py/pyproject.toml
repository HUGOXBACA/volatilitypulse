[project]
name = "volpulse-analytics"
version = "0.1.0"
description = "VolPulse quantitative analytics engine: surfaces, Greeks and signals"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "Proprietary" }
authors = [
    { name = "One_Byte_At_A_Time", email = "codeberg.reorder429@passfwd.com" }
]
dependencies = [
    "volpulse-core",
    "confluent-kafka>=2.6",
    "grpcio>=1.68",
    "numpy>=2.2,<2.6",
    "polars>=1.9",
    "prometheus-client>=0.21",
    "psycopg[binary,pool]>=3.2",
    "pyarrow>=17.0",
    "scipy>=1.14",
]

[project.optional-dependencies]
# The hardware acceleration path described in ADR 0004.
accelerate = [
    "numba>=0.63",
    "jax>=0.12",
]

[project.scripts]
volpulse-analytics = "volpulse_analytics.main:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "volpulse_analytics", from = "src" },
    { include = "volpulse_analytics/py.typed", from = "src" },
]

[tool.poetry.dependencies]
# The shared library is consumed from the monorepo, not from an index: the
# two halves of the Python stack change together.
volpulse-core = { path = "../../libs/py-core", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3"
pytest-asyncio = ">=0.24"
hypothesis = ">=6.170.11"
ruff = ">=0.7"
mypy = ">=1.13"
scipy-stubs = "^1.18.1.1"
