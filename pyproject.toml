[project]
name = "volatilitypulse"
version = "0.1.0"
description = "Institutional-grade options derivative & volatility analytics pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "Proprietary" }
authors = [
    { name = "One_Byte_At_A_Time", email = "codeberg.reorder429@passfwd.com" }
]
# Workspace root only: this project ships no importable package of its own.
# The actual packages live in libs/py-core and services/analytics-py.
dependencies = [
    # ── HTTP / streaming ───────────────────────────────────────────────────
    "requests>=2.32",
    "aiohttp>=3.10",
    "websockets>=13.0",
    "httpx>=0.27",
    # ── Data frames & validation ───────────────────────────────────────────
    "polars>=1.9",
    "pandas>=2.2",
    # numba caps numpy below 2.6, jax requires 2.2 or newer, scipy caps it
    # below 2.8: the intersection of those constraints is what is pinned here.
    "numpy>=2.2,<2.6",
    "pyarrow>=17.0",
    "pandera[pandas]>=0.24",
    # ── Numerics ───────────────────────────────────────────────────────────
    "scipy>=1.14",
    # ── Serialization / transport ──────────────────────────────────────────
    "protobuf>=5.28,<7.0",
    "grpcio>=1.68",
    "grpcio-tools>=1.68",
    "confluent-kafka>=2.6",
    # ── Storage ────────────────────────────────────────────────────────────
    "psycopg[binary,pool]>=3.2",
    # ── Observability ───────────────────────────────────────────────────────
    "prometheus-client>=0.21",
    # ── Configuration ───────────────────────────────────────────────────────
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The hardware acceleration path described in ADR 0004. It is not installed by
# default: numba and jax pull in large binary wheels, and nothing imports
# them yet. Install with `poetry install --extras accelerate` when the
# numerical hot loop needs to leave the interpreter.
accelerate = [
    "numba>=0.63",
    "jax>=0.12",
]

[tool.poetry]
# The workspace root is not a distributable package; it only carries the
# dependency set and the tooling configuration for the monorepo.
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3"
pytest-cov = ">=6.0"
pytest-asyncio = ">=0.24"
hypothesis = ">=6.112"
ruff = ">=0.7"
mypy = ">=1.13"
types-requests = ">=2.32"
types-pyyaml = ">=6.0"
scipy-stubs = ">=1.14"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# ─────────────────────────────────────────────────────────────────────────────
# Tooling configuration
# ─────────────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/.gen/**", "**/generated/**"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "ARG",  # flake8-unused-arguments
    "PL",   # pylint
    "RUF",  # ruff-specific
    "ANN",  # flake8-annotations
    "ASYNC",
    "S",    # bandit
]
ignore = [
    "ANN401",  # allow Any where genuinely dynamic (protobuf payloads)
    "PLR0913", # too many arguments — service constructors legitimately take config
    "PLR0917", # too many positional arguments — the pricing convention is positional
    "S101",    # assert — allowed in tests
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "PLR2004", "ANN201", "ARG001", "ARG002", "PLC0415"]
"**/__init__.py" = ["F401"]
# The command line entrypoints report to the terminal on purpose.
"services/analytics-py/src/volpulse_analytics/main.py" = ["T201"]
"libs/py-core/src/volpulse_core/clients/ivolatility/fetch_iv_data.py" = ["T201"]
"services/analytics-py/tests/benchmarks/run_benchmarks.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["volpulse", "volpulse_analytics"]

[tool.mypy]
python_version = "3.12"
# The generated protobuf stubs live outside the package roots; mypy needs
# them on the path to resolve the imports of the decoder.
mypy_path = ".gen/python"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
exclude = ["^\\.gen/", "^build/"]

[[tool.mypy.overrides]]
module = ["confluent_kafka.*", "numba.*", "jax.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The generated stubs are build artefacts: they are imported, never checked.
module = ["volpulse.*", "volpulse.options.v1.*"]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Generated protobuf stubs are build artefacts; never type-check them.
module = ["volpulse.options.v1.*", "volpulse.common.v1.*"]
ignore_errors = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["libs/py-core/tests", "services/analytics-py/tests", "tests"]
pythonpath = ["libs/py-core/src", "services/analytics-py/src"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires the local infra stack to be running",
    "e2e: full pipeline test across every service",
    "slow: long running test",
]
filterwarnings = ["error", "ignore::DeprecationWarning:botocore.*"]

[tool.coverage.run]
source = ["libs/py-core/src", "services/analytics-py/src"]
branch = true
omit = ["**/__init__.py", "**/generated/**"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
