version: v2

# Generated code is written to .gen/ and is gitignored: it is always rebuilt
# from contracts/ by `make proto`. Never hand-edit anything under .gen/.
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/volpulse/gen/go
    - file_option: java_package_prefix
      value: com.volpulse
    - file_option: java_multiple_files
      value: true
    - file_option: objc_class_prefix
      value: VP

plugins:
  # ── C++ (ingestion engine) ────────────────────────────────────────────────
  - remote: buf.build/protocolbuffers/cpp:v28.3
    out: .gen/cpp
    opt: lite
  - remote: buf.build/grpc/cpp:v1.67.1
    out: .gen/cpp

  # ── Python (analytics engine) ─────────────────────────────────────────────
  - remote: buf.build/protocolbuffers/python:v28.3
    out: .gen/python
    opt:
      - pyi_out
  - remote: buf.build/grpc/python:v1.67.1
    out: .gen/python
