[project]
name = "volatilitypulse"
version = "0.1.0"
description = "Institutional-grade options derivative & volatility analytics pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "Proprietary" }
authors = [
    { name = "One_Byte_At_A_Time", email = "codeberg.reorder429@passfwd.com" }
]
# Workspace root only: this project ships no importable package of its own.
# The actual packages live in libs/py-core and services/analytics-py.

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
# ── HTTP / streaming ───────────────────────────────────────────────────────
requests = "^2.32"
aiohttp = "^3.10"
websockets = "^13.0"
httpx = "^0.27"
# ── Data frames & validation ───────────────────────────────────────────────
polars = "^1.9"
pandas = "^2.2"
numpy = "^2.1"
pyarrow = "^17.0"
pandera = { version = "^0.20", extras = ["pandas"] }
# ── Numerics / hardware acceleration ───────────────────────────────────────
numba = "^0.60"
jax = "^0.4.35"
scipy = "^1.14"
# ── Serialization / transport ───────────────────────────────────────────────
protobuf = "^5.28"
grpcio = "^1.68"
grpcio-tools = "^1.68"
confluent-kafka = "^2.6"
# ── Storage ────────────────────────────────────────────────────────────────
psycopg = { version = "^3.2", extras = ["binary", "pool"] }
sqlalchemy = "^2.0"
# ── Observability ───────────────────────────────────────────────────────────
prometheus-client = "^0.21"
structlog = "^24.4"
python-json-logger = "^2.0"
# ── Configuration ──────────────────────────────────────────────────────────
python-dotenv = "^1.0"
pydantic = "^2.9"
pydantic-settings = "^2.6"
pyyaml = "^6.0"
# ── Artifact IO ────────────────────────────────────────────────────────────
h5py = "^3.12"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^6.0"
pytest-asyncio = "^0.24"
hypothesis = "^6.112"
ruff = "^0.7"
mypy = "^1.13"
mypy-protobuf = "^3.5"
types-requests = "^2.32"
types-pyyaml = "^6.0"
types-aiohttp = "^3.10"
ruff-lsp = "^0.0.6"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# ─────────────────────────────────────────────────────────────────────────────
# Tooling configuration
# ─────────────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/.gen/**", "**/generated/**"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "ARG",  # flake8-unused-arguments
    "PL",   # pylint
    "RUF",  # ruff-specific
    "ANN",  # flake8-annotations
    "ASYNC",
    "S",    # bandit
]
ignore = [
    "ANN401",  # allow Any where genuinely dynamic (protobuf payloads)
    "PLR0913", # too many arguments — service constructors legitimately take config
    "S101",    # assert — allowed in tests
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "PLR2004", "ANN201", "ARG001", "ARG002"]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["volpulse", "volpulse_analytics"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
plugins = ["mypy_protobuf.main"]
exclude = ["^\\.gen/", "^build/"]

[[tool.mypy.overrides]]
module = ["confluent_kafka.*", "numba.*", "jax.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["libs/py-core/tests", "services/analytics-py/tests", "tests"]
pythonpath = ["libs/py-core/src", "services/analytics-py/src"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires the local infra stack to be running",
    "e2e: full pipeline test across every service",
    "slow: long running test",
]
filterwarnings = ["error", "ignore::DeprecationWarning:botocore.*"]

[tool.coverage.run]
source = ["libs/py-core/src", "services/analytics-py/src"]
branch = true
omit = ["**/__init__.py", "**/generated/**"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
