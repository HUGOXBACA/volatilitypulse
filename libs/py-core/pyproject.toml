[project]
name = "volpulse-core"
version = "0.1.0"
description = "Shared domain models, provider clients and observability primitives for VolPulse"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "Proprietary" }
authors = [
    { name = "One_Byte_At_A_Time", email = "codeberg.reorder429@passfwd.com" }
]
dependencies = [
    # ── HTTP ───────────────────────────────────────────────────────────────
    "httpx>=0.27",
    "requests>=2.32",
    # ── Data frames & validation ───────────────────────────────────────────
    "polars>=1.9",
    "pandas>=2.2",
    "numpy>=2.2,<2.6",
    "pyarrow>=17.0",
    "pandera[pandas]>=0.24",
    "scipy>=1.14",
    # ── Serialization / transport ──────────────────────────────────────────
    "confluent-kafka>=2.6",
    "websockets>=12.0",
    "grpcio>=1.62",
    "grpcio-tools>=1.62",
    # ── Observability ───────────────────────────────────────────────────────
    # ── Configuration ───────────────────────────────────────────────────────
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pydantic-settings>=2.0",
    "aiofiles>=24.0",
]

[project.optional-dependencies]
# The hardware acceleration path described in ADR 0004.
accelerate = [
    "numba>=0.63",
    "jax>=0.12",
]

[project.scripts]
volpulse-fetch = "volpulse_core.clients.ivolatility.cli:main"
volpulse-ws-ingest = "volpulse_core.clients.websocket.cli:main"
volpulse-chain-build = "volpulse_core.chain.cli:main"
volpulse-fit-surface = "volpulse_core.surface.cli:main"
volpulse-control = "volpulse_core.control.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "volpulse_core", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3"
pytest-asyncio = ">=0.24"
hypothesis = ">=6.112"
ruff = ">=0.7"
mypy = ">=1.13"
scipy-stubs = "^1.18.1.1"
types-aiofiles = "^25.1.0.20260518"
grpcio-tools = "^1.84.1"
types-protobuf = "^7.35.1.20260906"
types-grpcio = "^1.84.0.20261021"

[tool.ruff.lint.per-file-ignores]
"libs/py-core/src/volpulse_core/clients/ivolatility/auth.py" = ["S105", "S106"]
"libs/py-core/src/volpulse_core/clients/ivolatility/client.py" = [
    "PLR2004",
    "ARG002",
    "RET504",
]
"libs/py-core/src/volpulse_core/clients/ivolatility/cli.py" = [
    "PLR2004",
    "PLR0915",
    "PLR0912",
    "T201",
    "ASYNC230",
    "PTH123",
]
"libs/py-core/src/volpulse_core/clients/ivolatility/equity.py" = ["PLR2004"]
"libs/py-core/src/volpulse_core/clients/ivolatility/futures.py" = ["PLR2004"]
"libs/py-core/src/volpulse_core/clients/ivolatility/models.py" = ["N815"]
"libs/py-core/src/volpulse_core/clients/ivolatility/endpoints.py" = ["PLR2004"]
"libs/py-core/tests/test_ivolatility_client.py" = ["S105", "PLR2004"]
